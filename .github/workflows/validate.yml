name: Workflows validieren

on:
  push:
    paths: ["workflows/**", "scripts/**"]
  pull_request:
    paths: ["workflows/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Struktur aller Workflows pruefen
        run: python3 scripts/validate.py
